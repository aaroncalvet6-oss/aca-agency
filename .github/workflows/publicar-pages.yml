name: Publicar GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dos despliegues se pisen; deja que el ultimo en cola gane.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      # Se publica SOLO la carpeta web/ (autocontenida: incluye web/motor/
      # con el motor de calculo y el fichero de tipos del BCE).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
