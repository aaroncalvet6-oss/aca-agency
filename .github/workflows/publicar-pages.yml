name: Publicar GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "web/**"
  # Los pushes que hacen los otros dos workflows usan el GITHUB_TOKEN por
  # defecto, y GitHub NUNCA deja que esos pushes disparen otros workflows
  # "on: push" (para evitar bucles infinitos) — asi que sin este trigger
  # aparte, un refresco de datos o una sincronizacion del motor NUNCA
  # redesplegaria la web sola, pese a lo que decia el commit original.
  workflow_run:
    workflows: ["Refrescar tipos de cambio del BCE", "Sincronizar motor con la web"]
    types: [completed]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# Evita que dos despliegues se pisen; deja que el ultimo en cola gane.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  publicar:
    # Si esto viene de un workflow_run, publicar solo si ese workflow
    # termino bien: un refresco de BCE o una sincronizacion fallida no
    # debe desplegar nada (mejor la web ya publicada que una a medias).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref: main explicito porque con workflow_run el checkout por
      # defecto no necesariamente resuelve a la ultima main.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      # Se publica SOLO la carpeta web/ (autocontenida: incluye web/motor/
      # con el motor de calculo y el fichero de tipos del BCE).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deployment
        uses: actions/deploy-pages@v4
